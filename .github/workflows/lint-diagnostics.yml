name: Temporary Lint Diagnostics

on:
  push:
    branches: ["main"]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Run lint and capture output
        run: npm run lint > lint-output.txt 2>&1
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: lint-output
          path: lint-output.txt
